data_dir: "./data"
node_id: "node-a"
cluster_id: "cluster-dev"
storage_mode: "local"
control_state_path: "./data/control_state.json"
commitlog:
  provider: "local"
  # snapshot_policy is only used by the builtin etcd-raft provider.
  # It controls raft log snapshot/compaction, not full LSM state transfer.
  # snapshot_policy:
  #   applied_entries: 1024
  #   retain_entries: 128
raft:
  replicas: 3
  election_timeout: "2s"
  heartbeat_interval: "500ms"
  peers: ["node-a", "node-b", "node-c"]
  # Set join: true only for a fresh node being added to an existing raft
  # cluster; it skips local bootstrap and waits for raft-add/ConfChange.
  # join: true
  # peer_urls is only required when commitlog.provider is "etcd-raft"
  # and raft.peers contains more than one node.
  # peer_urls:
  #   node-b: "http://127.0.0.1:8081"
  #   node-c: "http://127.0.0.1:8082"
  # join_peer_urls pre-registers future joiners for raft HTTP transport only;
  # these nodes are not bootstrap voters until raft-add commits.
  # join_peer_urls:
  #   node-d: "http://127.0.0.1:8083"
  # peer_url_file points at an absolute YAML/JSON node-to-URL map that is
  # reloaded by the raft HTTP transport resolver. It can provide endpoints for
  # future joiners without restarting existing nodes.
  # peer_url_file: "/var/lib/lsm/raft-peers.yaml"
shards:
  # shards are ordered by key-range routing; keep non-overlapping ranges.
  - id: "users-a-m"
    start_key: "a"
    end_key: "m"
    replicas: ["node-a", "node-b", "node-c"]
    leader: "node-a"
  - id: "users-m-z"
    start_key: "m"
    end_key: ""
    replicas: ["node-a", "node-b", "node-c"]
    leader: "node-b"
addr: "127.0.0.1:8080"
read_timeout: "5s"
write_timeout: "5s"
write_consistency_default: "accepted"
# Gateway-only option used by `lsmctl gateway --config`.
# Valid values: "any" (default) or "leader".
# gateway_read_mode: "any"
# Valid values: "round_robin" (default), "ordered", "freshest", or "adaptive".
# gateway_read_balance_policy: "round_robin"
# Optional freshness gate for any-mode `/kv/get` and `/kv/range`; -1 disables.
# gateway_max_read_apply_lag: -1
# gateway_max_write_attempts: 2
# gateway_write_retry_backoff: "0s"
# gateway_endpoint_failure_cooldown: "5s"
# gateway_endpoint_file: "/etc/lsm/node-endpoints.yaml"
# gateway_endpoint_dns_name: "lsm-cluster.lsm-cluster.svc.cluster.local"
# gateway_endpoint_dns_service: "http"
# gateway_endpoint_dns_proto: "tcp"
# gateway_endpoint_dns_scheme: "http"
# Optional /readyz gates for supervisors; defaults keep write-leader readiness only.
# gateway_ready_min_reachable: 0
# gateway_ready_max_read_apply_lag: -1
# gateway_ready_min_read_ready: 0
# Optional local storage tuning. Backpressure thresholds are disabled when 0.
# memtable_limit: 1048576
# wal_max_segment_bytes: 67108864
# wal_retain_archived_segments: 2
# wal_ready_max_checkpoint_lag: 0
# flush_queue_size: 4
# compaction_l0_threshold: 4
# compaction_check_interval: "30s"
# compaction_adaptive_check: true
# flush_backpressure_queue_threshold: 0
# compaction_backpressure_l0_threshold: 0
# io_backend: "async"
# io_backend_strict: false
# io_async_max_in_flight: 64
